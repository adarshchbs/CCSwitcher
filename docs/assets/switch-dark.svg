<svg xmlns="http://www.w3.org/2000/svg" width="900" height="456" viewBox="0 0 900 456" role="img" aria-label="What one click does: back up, swap the token, update the profile, verify"><title>What one click does: back up, swap the token, update the profile, verify</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5366"/></marker><marker id="warnarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F2B45A"/></marker><marker id="rosearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF9EB8"/></marker><marker id="personalarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5FD4C4"/></marker></defs><rect width="900" height="456" rx="16" fill="#151A24"/><rect x="40" y="30" width="232" height="40" rx="20" fill="#163431" stroke="#5FD4C4" stroke-opacity="0.6"/><text x="62" y="55" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8EBF3" text-anchor="start">You click</text><circle cx="146" cy="50" r="10" fill="#5FD4C4"/><text x="146" y="54.2" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#16161A" text-anchor="middle">P</text><text x="163" y="55" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#E8EBF3" text-anchor="start">Personal</text><text x="296" y="55" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9AA1B5" text-anchor="start">in the menu. Nothing else ever starts a switch.</text><line x1="58" y1="70" x2="58" y2="348" stroke="#4A5366" stroke-width="1.5"/><circle cx="58" cy="120" r="14" fill="#1E2431" stroke="#4A5366" stroke-width="1.5"/><text x="58" y="124.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8EBF3" text-anchor="middle">1</text><text x="86" y="117" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EBF3" text-anchor="start">Back up the current login</text><text x="86" y="137" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA1B5" text-anchor="start">Team's newest token goes to its saved slot.</text><line x1="430" y1="120" x2="508" y2="120" stroke="#4A5366" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="516" y="92" width="344" height="56" rx="12" fill="#1E2431" stroke="#2E3646"/><circle cx="58" cy="196" r="14" fill="#1E2431" stroke="#4A5366" stroke-width="1.5"/><text x="58" y="200.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8EBF3" text-anchor="middle">2</text><text x="86" y="193" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EBF3" text-anchor="start">Swap the token</text><text x="86" y="213" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA1B5" text-anchor="start">Only claudeAiOauth changes. MCP logins stay.</text><line x1="430" y1="196" x2="508" y2="196" stroke="#4A5366" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="516" y="168" width="344" height="56" rx="12" fill="#1E2431" stroke="#2E3646"/><circle cx="58" cy="272" r="14" fill="#1E2431" stroke="#4A5366" stroke-width="1.5"/><text x="58" y="276.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8EBF3" text-anchor="middle">3</text><text x="86" y="269" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EBF3" text-anchor="start">Update the profile</text><text x="86" y="289" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA1B5" text-anchor="start">Personal's org and email go into oauthAccount.</text><line x1="430" y1="272" x2="508" y2="272" stroke="#4A5366" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="516" y="244" width="344" height="56" rx="12" fill="#1E2431" stroke="#2E3646"/><circle cx="58" cy="348" r="14" fill="#1E2431" stroke="#4A5366" stroke-width="1.5"/><text x="58" y="352.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E8EBF3" text-anchor="middle">4</text><text x="86" y="345" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E8EBF3" text-anchor="start">Check who owns the token</text><text x="86" y="365" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9AA1B5" text-anchor="start">Anthropic must answer Personal.</text><line x1="430" y1="348" x2="508" y2="348" stroke="#4A5366" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="516" y="320" width="344" height="56" rx="12" fill="#1E2431" stroke="#2E3646"/><text x="532" y="112" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#9AA1B5" text-anchor="start">Saved logins</text><rect x="532" y="121" width="48" height="22" rx="11" fill="#262C4A" stroke="#9DA8FF" stroke-opacity="0.5"/><text x="556.0" y="136.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#9DA8FF" text-anchor="middle">Team</text><rect x="588" y="121" width="76" height="22" rx="11" fill="#163431" stroke="#5FD4C4" stroke-opacity="0.5"/><text x="626.0" y="136.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#5FD4C4" text-anchor="middle">Personal</text><text x="844" y="136" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9AA1B5" text-anchor="end">CCSwitcher’s Keychain items</text><text x="532" y="188" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#9AA1B5" text-anchor="start">Claude Code-credentials</text><rect x="532" y="197" width="197" height="22" rx="11" fill="#163431" stroke="#5FD4C4" stroke-opacity="0.5"/><text x="630.5" y="212.5" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#5FD4C4" text-anchor="middle">claudeAiOauth → Personal</text><rect x="737" y="197" width="131" height="22" rx="11" fill="#1E2431" stroke="#4A5366" stroke-opacity="0.5"/><text x="802.5" y="212.5" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#4A5366" text-anchor="middle">mcpOAuth · kept</text><text x="532" y="264" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#9AA1B5" text-anchor="start">~/.claude.json</text><rect x="532" y="273" width="190" height="22" rx="11" fill="#163431" stroke="#5FD4C4" stroke-opacity="0.5"/><text x="627.0" y="288.5" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#5FD4C4" text-anchor="middle">oauthAccount → Personal</text><text x="532" y="340" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#9AA1B5" text-anchor="start">api.anthropic.com</text><rect x="532" y="349" width="153" height="22" rx="11" fill="#1E2431" stroke="#4A5366" stroke-opacity="0.5"/><text x="608.5" y="364.5" font-family="ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#4A5366" text-anchor="middle">/api/oauth/profile</text><text x="844" y="364" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9AA1B5" text-anchor="end">access token only</text><path d="M 44 354 C 14 328, 14 140, 44 126" fill="none" stroke="#F2B45A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#warnarrow)"/><rect x="40" y="392" width="820" height="40" rx="10" fill="#3A2E1C"/><text x="58" y="417" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F2B45A" text-anchor="start">↺</text><text x="80" y="417" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EBF3" text-anchor="start">If any step fails, or Anthropic names another org, the step 1 backup is put back.</text></svg>
