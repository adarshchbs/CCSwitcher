name: CCSwitcher
options:
  bundleIdPrefix: com.adarshchbs
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad hoc signing: no team, no certificate.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  CCSwitcher:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adarshchbs.ccswitcher
        PRODUCT_NAME: CCSwitcher
        MARKETING_VERSION: "3.0.0-fork.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        # Not sandboxed: the app reads and writes ~/.claude.json and Claude
        # Code's Keychain item. No entitlements file.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        # Xcode adds get-task-allow to ad hoc builds, which lets other
        # processes attach to the app and read its memory (tokens included).
        # Keep it for Debug only.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # The tests compile the app's logic directly instead of loading it into the
  # app: a hosted test bundle would launch CCSwitcher, and the app must never
  # run against the real Keychain or ~/.claude.json during tests.
  CCSwitcherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CCSwitcherTests
      - path: Sources
        excludes:
          - "App.swift"
          - "AppModel.swift"
          - "Prompts.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adarshchbs.ccswitcher.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""

schemes:
  CCSwitcher:
    build:
      targets:
        CCSwitcher: all
    test:
      targets:
        - CCSwitcherTests
